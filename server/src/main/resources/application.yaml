server:
  address: 0.0.0.0
  port: ${SHOVE_PORT:8787}
  shutdown: graceful
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: shove-server
  datasource:
    url: jdbc:sqlite:${SHOVE_DB_PATH:shove.db}
    driver-class-name: org.sqlite.JDBC
  lifecycle:
    timeout-per-shutdown-phase: 10s
  servlet:
    multipart:
      enabled: false

shove:
  server-name: ${SHOVE_SERVER_NAME:Shove on Windows}
  storage-root: ${SHOVE_STORAGE_ROOT:.shove-data}
  external-storage-root: ${SHOVE_EXTERNAL_STORAGE_ROOT:}
  external-storage-name: ${SHOVE_EXTERNAL_STORAGE_NAME:External SSD}
